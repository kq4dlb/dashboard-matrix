services:
  dashboard-matrix:
    build:
      context: .
      args:
        DASHBOARD_MATRIX_INSTALL_ICOM_IP: ${DASHBOARD_MATRIX_INSTALL_ICOM_IP:-0}
    ports:
      - "8080:8080"
    environment:
      DASHBOARD_MATRIX_ADMIN_PASSWORD: ${DASHBOARD_MATRIX_ADMIN_PASSWORD:-admin}
      DASHBOARD_MATRIX_SESSION_SECRET: ${DASHBOARD_MATRIX_SESSION_SECRET:-change-this-before-public-use}
      ICOM_705_REMOTE_PASSWORD: ${ICOM_705_REMOTE_PASSWORD:-}
    volumes:
      - dashboard-matrix-data:/var/lib/dashboard-matrix
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  dashboard-matrix-data:
